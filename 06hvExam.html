<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高压电工作业 · 题库练习</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1f2d3d; --ink2:#5a6b7b;
  --line:#e3e8f0; --blue:#2563eb; --blue-d:#1d4ed8;
  --green:#16a34a; --green-bg:#e8f7ee; --red:#dc2626; --red-bg:#fdeaea;
  --amber:#b45309; --amber-bg:#fef3e2;
  --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.container{max-width:920px;margin:0 auto;padding:16px 16px 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:10}
.topbar .brand{font-weight:700;color:var(--blue-d)}
.topbar .user{color:var(--ink2);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:14px}
h2{margin:0 0 10px;font-size:18px}
h3{margin:14px 0 8px;font-size:15px}
.muted{color:var(--ink2);font-size:13px}
.btn{display:inline-block;border:1.5px solid var(--blue);color:#fff;background:var(--blue);border-radius:8px;padding:8px 18px;margin:4px 6px 4px 0;font-size:14px}
.btn:hover{background:var(--blue-d)}
.btn.gray{background:#fff;color:var(--ink2);border-color:var(--line)}
.btn.gray:hover{background:#f0f2f7}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:4px 10px;font-size:12px;margin:0}
.ggroup{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gcard{border:2px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;background:#fff}
.gcard:hover{border-color:var(--blue)}
.gcard.active{border-color:var(--blue);background:#eef4ff}
.gcard h4{margin:0 0 4px;font-size:16px}
.gcard .stat{font-size:12px;color:var(--ink2);min-height:38px}
.gcard .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.gcard .bar i{display:block;height:100%;background:var(--green)}
.chip{display:inline-block;border:1px solid var(--line);background:#f7f9fc;color:var(--ink2);border-radius:99px;padding:2px 10px;font-size:12px;margin-left:6px}
.chip.ok{border-color:#b6e2c7;background:var(--green-bg);color:var(--ok)}
.chip.tag-j{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}
.chip.tag-s{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.progress-line{font-size:13px;color:var(--ink2);margin:8px 0}
.progress-line b{color:var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.stem{font-size:15px;font-weight:600;white-space:pre-wrap;margin:10px 0}
.opts{list-style:none;margin:14px 0;padding:0}
.opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;margin:5px 0;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--blue)}
.opt .letter{flex:0 0 26px;height:26px;border-radius:50%;background:#f0f2f7;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--blue);background:#eff6ff}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.locked{cursor:default}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong .letter{background:var(--red);color:#fff}
.feedback{border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px}
.feedback.ok{background:var(--green-bg);color:var(--ok);border:1px solid #b6e2c7}
.feedback.bad{background:var(--red-bg);color:var(--bad);border:1px solid #f3c1c1}
.feedback .ans{font-weight:700}
.feedback .explain{margin-top:8px;color:var(--ink);font-weight:400}
.tagline{font-size:12px;color:var(--ink2);margin-top:6px}
.mwrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.mbox{background:#fff;border-radius:12px;width:min(660px,92vw);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.mbody{padding:14px 16px;overflow:auto}
#modalGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.gnum{border:1px solid var(--line);border-radius:7px;background:#fff;text-align:center;padding:8px 0;font-size:12px;color:var(--ink)}
.gnum:hover{border-color:var(--blue);color:var(--blue);font-weight:700}
.gnum.correct{background:var(--green-bg);color:var(--ok);border-color:#b6e2c7}
.gnum.wrong{background:var(--amber-bg);color:var(--amber);border-color:#f5d9ae}
.gnum.cur{outline:3px solid var(--blue)}
.mlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:10px 16px 14px;border-top:1px solid var(--line)}
.mlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
input[type=text]{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;width:260px}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.notice{background:var(--amber-bg);border:1px solid #f5d9ae;color:var(--amber);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14px;white-space:pre-wrap}
.notice.good{background:var(--green-bg);border-color:#b6e2c7;color:var(--ok)}
.review-list{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;background:#fff}
.review-list .rline{padding:6px 0;border-bottom:1px dashed var(--line)}
.review-list .rline:last-child{border-bottom:0}
.review-list .rline .no{font-weight:700;color:var(--blue-d);margin-right:8px}
.review-list .rline .st{font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.tbl th{background:#f7f9fc}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(31,45,61,.92);color:#fff;padding:10px 20px;border-radius:99px;z-index:99;font-size:14px;max-width:80vw}
@media(max-width:560px){.ggroup{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login">
  <div class="container" style="max-width:460px;margin-top:10vh">
    <div class="card" style="text-align:center">
      <div style="font-size:44px">⚡</div>
      <h2 style="margin:8px 0">高压电工作业 · 题库练习</h2>
      <div class="muted" style="margin-bottom:16px">输入用户名以识别练习进度（无需密码，数据仅保存在本机浏览器）</div>
      <input type="text" id="loginName" placeholder="例如：张三" maxlength="24">
      <div style="margin-top:14px"><button class="btn" id="btnLogin" style="width:100%">进入练习</button></div>

<!-- 主应用 -->

  </div>
  <div class="container" id="page"></div>
</div>

<!-- 题号跳转模态框 -->
<div id="modal" class="mwrap hidden">
  <div class="mbox">
    <div class="mhead"><b id="modalHeadText">按序号选择题目</b><button class="btn gray sm" id="mClose">✕ 关闭</button></div>
    <div class="mbody"><div id="modalGrid"></div></div>
    <div class="mlegend">
      <span><i style="background:var(--green-bg);border:1px solid #b6e2c7"></i>已答对</span>
      <span><i style="background:var(--amber-bg);border:1px solid #f5d9ae"></i>答错过/待复练</span>

      <span><i style="background:var(--blue)"></i>当前题</span>

    </div>
  </div>
</div>

/* ================= 工具 ================= */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function parseOpts(o){ return Array.isArray(o)?o:[o]; }
function tight(s){ return String(s==null?'':s).replace(/\r\n/g,'\n').replace(/[ \t]*\n[ \t]*(?=\n)/g,'').replace(/\n{3,}/g,'\n\n').trim(); }
function nowH(){ return Date.now()/3600000; }
function fmtTime(ts){ if(!ts) return '—'; const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }

/* ================= 轮次队列（组内滚动重推） =================
 * 规则：
 * - 本轮队列 = 组内“未答对”的题 + 间隔到期的“已答对”题（回归复习）。
 *   “未答对” = 从未作答，或当前未掌握（correct=false，即最近一次作答为错）。
 * - 队列顺序：先按“真实考试顺序”排已答对的题（选择题按原序在前、判断题在后），
 *   组内未答对的题统一排到队尾（同样先选择后判断），保证“全组做完后再补练错题”。
 * - 本轮答对 → 该题本轮不再出现；本轮答错 → 该题立即排回本轮队列末尾，本轮内反复出现，直到答对为止。
 * - 组内答对且未到遗忘间隔的题不在本轮推送（间隔到期才回归复习一次）。
 * - “未掌握 N 题” 统计口径 = 组内尚未答对的题数（即本轮队列中未答对部分的题数）。
 */
/* 选择题选项乱序：本次作答（同一轮次）内选项顺序锁定不变（答题、查看解析、回看均一致），
   下一次作答（下一轮）才重新洗牌。判断题（正确/错误）固定不洗。
   用 组号+题号+轮次 作为随机源，保证同一轮内确定性一致，下一轮得到新的排列。 */
let curOptOrder = {};          // 当前轮次的选项排列缓存 {qid: [原始下标...]}
function optOrder(qid, round, gid, nOpts){
  if(curOptOrder[qid]) return curOptOrder[qid];
  const r = mulberry32((qid>>>0)*2654435761 % 2147483647 + round*97 + gid*7919);
  const arr = [];
  for(let i=0;i<nOpts;i++) arr.push(i);
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  curOptOrder[qid] = arr;
  return arr;
}

function queueForRound(u, gid, round){
  const g = u.groups[gid] || { questions:{} };
  const grp = COURSE_DATA.groups[gid-1];
  const now = nowH();
  // 组内“未答对”的题：从未作答，或当前未掌握（最近一次作答为错）
  const isNotMastered = q => {
    const s = g.questions[q.question_id];
    return !s || !s.seen || !s.correct;
  };
  // 已答对的题：仅当遗忘间隔到期才回归复习一次（间隔未到则本轮不推）
  const dueBack = q => {
    const s = g.questions[q.question_id];
    if(!s || !s.correct) return false;
    const slot = Math.min(s.wrong||0, INTERVALS.length-1);
    const due = (s.lastCorrectAt||0) + INTERVALS[slot]*3600000;
    return due <= now;
  };
  const s_correct = q => { const s = g.questions[q.question_id]; return !!(s && s.correct); };
  // 按“真实考试顺序”组织：先做选择题、后做判断题（按原 seq 升序）
  const byKind = arr => {
    const singles = [], judges = [];
    for(const q of arr){ if(q.kind==='judge') judges.push(q); else singles.push(q); }
    singles.sort((a,b)=> a.seq - b.seq);
    judges.sort((a,b)=> a.seq - b.seq);
    const out = [];
    for(const q of singles) out.push({q, qin:false});
    for(const q of judges) out.push({q, qin:false});
    return out;
  };
  const pool = [
    ...byKind(grp.questions.filter(dueBack)),                          // 已答对且间隔到期：回归复习
    ...byKind(grp.questions.filter(q => isNotMastered(q)))            // 未答对的题：排到队尾补练
  ];
  // 队列里同一题不会出现两次（已答对与未答对互斥）；组内 seq 顺序保持不变
  return pool;
}

/* ================= 统计 ================= */
function stats(gid){
  const u = loadUser(curUser);
  const grp = COURSE_DATA.groups[gid-1];
  const g = u.groups[gid];
  const total = grp.questions.length;
  if(!g) return {total, answered:0, unmastered:total, wrongNow:total, allCorrect:false, rounds:0, lastSaved:null};
  const qn = total;
  let answered=0, unmastered=0, wrongNow=0; const wrongIds=[];
  for(const q of grp.questions){
    const s = g.questions[q.question_id];
    if(!s || !s.seen){ unmastered++; continue; }   // 未作答也算“未答对”
    answered++;
    if(!s.correct){ unmastered++; wrongNow++; wrongIds.push(q.question_id); }
  }
  return {
    total:qn, answered, unmastered, wrongNow, wrongIds,
    allCorrect: unmastered===0 && qn>0,
    rounds: g.attempts||0,
    lastSaved: g.lastSaved||g.lastReset||null
  };
}

  curQueue = queueForRound(u, gid, round);
  curPos = 0;
  renderQuestion();
}

/* ---------------- 答题页 ---------------- */
function renderQuestion(){
  const u = loadUser(curUser);
  const grp = COURSE_DATA.groups[curGid-1];
  const cur = curQueue[curPos];
  const isRepush = !!(cur && cur.qin);   // 是否为本轮内“答错后重新推上来”的题
  let html = `<div class="card" style="margin-top:14px">
    <div class="progress-line">
      <b>${esc(grp.title)}</b> · 第 ${curRound} 轮${isRepush?' · <span style="color:var(--amber)">本轮补练</span>':''} · 队列剩余 <b>${curQueue.length-curPos}</b> 题
      <span class="chip tag-j">判断 ${grp.judge_count}</span><span class="chip tag-s">选择 ${grp.single_count}</span>
    </div>
  </div>`;

  if(!cur){
    // 本轮队列走完
    const st = stats(curGid);
    const remain = st.unmastered;
    const okAll = st.allCorrect;
    html += `<div class="card">
      <h2>${okAll?'🎉 本组全部题目已掌握':'🏁 本轮练习完成'}</h2>
      <div class="notice ${okAll?'good':''}">${okAll
        ? `本组全部 ${grp.total} 题已答对，视为完全掌握。可继续下一组；已答对的题会按遗忘间隔（${INTERVALS.join(' / ')} 小时）稍后回归复习。`
        : `组内还有 <b>${remain}</b> 题未答对。继续下一轮时，这些题会排在队末重点补练：答错多少次，就在组内反复重推多少次，直到全部答对为止。`}</div>
      <div style="margin-top:14px">
        <button class="btn" id="btnNextRound">开始下一轮（继续补练未答对的题）</button>
        <button class="btn gray" id="btnBackGrp">返回分组</button>
      </div>
    </div>`;
    $('#page').innerHTML = html;
    $('#btnNextRound').onclick = ()=> startRoundN(curGid, curRound+1);
    $('#btnBackGrp').onclick = ()=>{ curGid=null; renderGroups(); };
    return;
  }

  const q = cur.q;
  const s = qState(u, curGid, q.question_id);
  const rawOpts = parseOpts(q.options);
  const fb = curFeedback[curPos] || null;   // 按位置取反馈（同一题可能在队列里出现多次，各位置独立）
  const chosenRaw = fb ? fb.raw : undefined;
  // 选择题选项乱序（本次作答内锁定；下一轮重新洗牌；判断题固定 正确/错误 顺序）
  const isSingle = q.kind==='single';
  const perm = isSingle ? optOrder(q.question_id, curRound, curGid, rawOpts.length) : null;
  // 正确答案在“原始选项”中的下标：选择题 A=0,B=1…；判断题按数据 answer 字段（A=正确→0，B=错误→1）
  const rawAnsIdx = isSingle ? (q.answer.charCodeAt(0)-65) : ((q.answer==='B')?1:0);
  // 本次显示下，正确选项所在位置（显示下标）与对应字母（判断题选项顺序固定，直接等于 rawAnsIdx）
  const correctDispIdx = isSingle ? perm.indexOf(rawAnsIdx) : rawAnsIdx;
  const correctDispLetter = String.fromCharCode(65+correctDispIdx);
  let optHtml = '';
  const nDisp = rawOpts.length;
  for(let i=0;i<nDisp;i++){
    const rawIdx = isSingle ? perm[i] : i;     // 显示位 i → 原始下标
    const txt = isSingle ? rawOpts[rawIdx] : rawOpts[i];
    const L = String.fromCharCode(65+i);
    let cls = 'opt';
    if(chosenRaw!==undefined){
      cls += ' locked';
      if(rawIdx===rawAnsIdx) cls += ' correct';
      else if(rawIdx===chosenRaw) cls += ' wrong';
    }
    optHtml += `<li class="${cls}" data-raw="${rawIdx}"><span class="letter">${L}</span><span>${esc(txt)}</span></li>`;
  }
  let fbHtml = '';
  if(fb){
    const okc = fb.ok;
    fbHtml = `<div class="feedback ${okc?'ok':'bad'}">
      <div class="ans">${okc?'✓ 回答正确':'✗ 回答错误，正确答案：'+correctDispLetter}</div>
      ${q.analysis&&q.analysis!=='暂无'?`<div class="explain">${'解析：'+esc(tight(q.analysis))}</div>`:''}
      ${!okc?`<div class="explain">该题本轮内已重排到队尾补练（累计答错 ${s.wrong} 次），答对前会在本轮继续出现；答对后，间隔 ${INTERVALS[Math.min(s.wrong,INTERVALS.length-1)]} 小时到期的回归复习仍会再考一次。</div>`:''}
    </div>`;
  }
  html += `<div class="card" style="margin-top:14px">
    <div class="qhead">
      <div><span class="chip ${q.kind==='judge'?'tag-j':'tag-s'}">${q.kind==='judge'?'判断题':'选择题'}</span>
        <span class="chip">题序 ${q.index_in_group} / ${grp.total}</span>
        <span class="chip">第 ${curPos+1} / ${curQueue.length} 题</span></div>
      <div>
        <button class="btn gray sm" id="btnPrev">← 上一题</button>
        <button class="btn gray sm" id="btnNext">下一题 →</button>
        <button class="btn gray sm" id="btnJump">按序号跳转</button>
      </div>
    </div>
    <div class="stem">${esc(q.stem)}</div>
    <ol class="opts" id="opts">${optHtml}</ol>
    ${fbHtml}
    <div class="tagline">答对自动跳下一题 · 答错的题排到队尾，本轮做完全队列后重考它（不会提前结束本轮） · 选项作答后锁定</div>
  </div>`;
  $('#page').innerHTML = html;

  document.querySelectorAll('#opts .opt').forEach(el=>{
    el.onclick = ()=> chooseRaw(+el.dataset.raw, q, s);
  });
  const prev = ()=>{ if(curPos>0){ curPos--; renderQuestion(); } };
  const next = ()=> nextBtn();
  $('#btnPrev').onclick = prev;
  $('#btnNext').onclick = next;
  $('#btnJump').onclick = openModal;
  // 快捷键
  document.onkeydown = e=>{
    if($('#modal').classList.contains('hidden')){
      if(e.key==='ArrowLeft') prev();
      if(e.key==='ArrowRight') next();
    }
  };
  window.scrollTo(0,0);
}

/* 严格顺序导航：「下一题」= curPos + 1，「上一题」= curPos - 1，都不跳题。
   初始队列按「先选择、后判断、原序」排定；答错的题不会从中间删除，而是以“补练副本”
   追加到队尾（队列只增不减），本轮走到队尾时重考，答错再追加，直到答对才结束。
   因为队列中间从不被删除，curPos 与“第 N 题”始终一一对应，来回翻页不会错位或跳题。 */
function nextBtn(){
  if(curPos+1 < curQueue.length){
    curPos++;
    renderQuestion();
  } else {
    finishRound();
  }
}

/* rawIdx：用户点选的是“原始选项下标”（0 起）。判断题固定 A=0/B=1。
   保存原始下标而非显示字母，选项顺序锁定后重新渲染（如查看解析）选中/对错标记依然一致。
   作答反馈按【位置】记录（curFeedback[curPos]）而不是按题目 ID：答错的题会以“补练副本”
   追加到队尾，同一题在本轮可能出现多次，每个位置的作答状态必须相互独立，
   否则回看原位置时会被队尾的新作答覆盖，造成“答案丢失/跳题”的错觉。 */
function chooseRaw(rawIdx, q, s){
  if(curFeedback[curPos]) return;          // 该位置已作答，锁定
  const u = loadUser(curUser);
  // 正确答案原始下标：选择题 A=0,B=1…；判断题按数据 answer（A=正确→0，B=错误→1）
  const rawAnsIdx = q.kind==='single' ? (q.answer.charCodeAt(0)-65) : ((q.answer==='B')?1:0);
  const ok = rawIdx===rawAnsIdx;
  curFeedback[curPos] = {raw: rawIdx, ok}; // 记录本位置的作答反馈（位置独立）
  const s2 = qState(u, curGid, q.question_id);   // 内部会 ensureGroup，组数据必然存在
  s2.seen = true;
  s2.lastSeenAt = Date.now();
  if(ok){
    s2.correct = true;
    s2.lastCorrectAt = Date.now();
  } else {
    s2.correct = false;
    s2.wrong = (s2.wrong||0)+1;
    s2.lastWrongAt = Date.now();
  }
  ensureGroup(curGid).groups[curGid].lastSaved = Date.now();
  saveUser(u);
  if(!ok){
    // 答错：先把该题作为“补练副本”追加到队尾，再渲染反馈页——这样反馈页上的
    // “第 N 题 / 队列剩余”立即反映新增的补练量，数字准确。
    // 不删除当前位置的题（中间删除会让 curPos 与“第 N 题”错位，导致翻页跳题），
    // 当前位置保留答错反馈与解析供回看；本轮走到队尾时重考补练副本，答错再追加，直到答对。
    const p0 = curQueue[curPos];
    if(p0) curQueue.push({q: p0.q, qin: true});
  }
  renderQuestion();
  if(ok){
    setTimeout(()=>{
      if(curQueue.every((p,i)=> curFeedback[i]!==undefined)) finishRound();
      else nextBtn();
    }, 900);
  }
}

function finishRound(){
  const u = loadUser(curUser);
  ensureGroup(curGid).groups[curGid].lastSaved = Date.now();
  saveUser(u);
  curQueue = []; curPos = 0; curFeedback = [];
  renderQuestion();
}

/* ---------------- 模态框 ---------------- */
function openModal(){
  const grp = COURSE_DATA.groups[curGid-1];
  $('#modalHeadText').textContent = `按序号选择题目（1–${grp.total}）`;
  $('#modal').classList.remove('hidden');
  buildGrid();
}
function buildGrid(){
  const u = loadUser(curUser);
  const g = u.groups[curGid]||{questions:{}};
  const grp = COURSE_DATA.groups[curGid-1];
  const q = curQueue[curPos]? curQueue[curPos].q : null;
  let html='';
  grp.questions.forEach(p=>{
    const s = g.questions[p.question_id];
    let cls='gnum';
    if(s && s.correct) cls+=' correct';
    else if(s && (s.wrong>0 || s.seen)) cls+=' wrong';
    if(q && p.question_id===q.question_id) cls+=' cur';
    html += `<div class="${cls}" data-qid="${p.question_id}" data-seq="${p.seq}">${p.index_in_group}</div>`;
  });
  $('#modalGrid').innerHTML = html;
  document.querySelectorAll('#modalGrid .gnum').forEach(el=>{
    el.onclick = ()=>{
      const qid = +el.dataset.qid;
      let idx = curQueue.findIndex(p=> p.q.question_id===qid);
      if(idx<0){
        // 不在当前队列（已答对且遗忘间隔未到）：跳到当前题并提示
        idx = curPos;
        toast('该题已答对，遗忘间隔未到，本轮暂不推送；已停在当前题');
      }
      curPos = idx;
      $('#modal').classList.add('hidden');
      renderQuestion();
    };
  });
}
$('#mClose').onclick = ()=> $('#modal').classList.add('hidden');
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('#modal').classList.add('hidden'); });

/* ---------------- 统计页 ---------------- */
function renderStats(){
  const u = loadUser(curUser);
  let html = `<h2>练习统计 · <span>${esc(curUser)}</span></h2>
    <div class="card"><h3>各组进度</h3>
    <table class="tbl"><tr><th>组</th><th>轮次</th><th>已答对/总</th><th>掌握率</th><th>未答对</th><th>最近活动</th></tr>`;
  COURSE_DATA.groups.forEach(gr=>{
    const st = stats(gr.id);
    const mastered = st.total-st.unmastered;
    const pct = st.total? Math.round((mastered/st.total)*100):0;
    html += `<tr><td>${gr.id}</td><td>${st.rounds}</td><td>${mastered}/${st.total}</td>
      <td>${pct}%</td><td>${st.unmastered}</td><td>${fmtTime(st.lastSaved)}</td></tr>`;
  });
  html += `</table></div>`;

  // 重点复习建议：跨组收集未掌握题，按（答错次数、最近答错时间）排序
  const cand = [];
  for(const gr of COURSE_DATA.groups){
    const g = u.groups[gr.id]; if(!g) continue;
    for(const q of gr.questions){
      const s = g.questions[q.question_id];
      if(!s || !s.seen || s.correct) continue;
      cand.push({q, s});
    }
  }
  cand.sort((a,b)=> (b.s.wrong - a.s.wrong) || ((b.s.lastWrongAt||0)-(a.s.lastWrongAt||0)));
  const top = cand.slice(0,10);
  html += `<div class="card"><h3>📌 重点复习建议（答错最多 / 最近答错 前 ${Math.min(10,cand.length)} 题）</h3>`;
  if(!top.length){
    html += `<div class="notice good">暂无未掌握题目，继续保持！全部题目答对并通过一轮完整检查后，将视为完全掌握。</div>`;
  } else {
    html += `<div class="review-list">`;
    top.forEach((c,i)=>{
      html += `<div class="rline"><span class="no">${i+1}.</span>
        <span class="st">第${c.q.group}组 · 题序${c.q.index_in_group} · 累计答错 ${c.s.wrong} 次 · 最近答错 ${fmtTime(c.s.lastWrongAt)}</span><br>
        <span class="muted">题干：${esc((c.q.stem||'').slice(0,70))}…（正确答案 <b>${c.q.answer}</b>）</span></div>`;
    });
    html += `</div>
    <div class="muted" style="margin-top:8px">提示：这些题会在后续轮次中按遗忘曲线优先推送。点击“练习”按钮可直接跳到对应组继续。</div>
    <div style="margin-top:8px"><button class="btn" id="btnGoTop">继续练习该组 →</button></div>`;
  }
  html += `</div>`;

  html += `<div class="card"><h3>重推与遗忘曲线说明</h3><div class="muted">
    · 组内做错的题会<b>排到组尾在本轮内反复补练</b>，答错多少次就重推多少次，直到全部答对；组内全答对后本轮才结束。<br>
    · 已答对的题本轮不再出现；按 <b>1h → 6h → 12h → 36h → 72h</b> 的遗忘间隔到期的题，会在后续轮次回归复习一次确认仍掌握。<br>
    · “未答对 N” = 组内尚未答对的题数（含从未作答的题）。组内全部答对时，该组视为<b>完全掌握</b>。
  </div></div>`;

  html += `<div class="card"><h3>数据管理</h3>
    <button class="btn danger" id="btnResetOne">重置第 ${curGid||'—'} 组</button>
    <button class="btn danger" id="btnResetAll">重置全部数据</button>
    <button class="btn gray" id="btnBackGrp">← 返回分组</button>
  </div>`;
  $('#page').innerHTML = html;
  $('#btnBackGrp').onclick = ()=>{ renderGroups(); };
  $('#btnResetAll').onclick = resetAll;
  $('#btnResetOne').onclick = resetOne;
  const gt = $('#btnGoTop'); if(gt) gt.onclick = ()=>{
    if(cand.length){
      const g0 = cand[0].q.group;
      startGroup(g0);
      // 跳到该题
      const qid = cand[0].q.question_id;
      const idx = curQueue.findIndex(p=> p.q.question_id===qid);
      curPos = idx>=0? idx : 0;
      renderQuestion();
    }
  };
}

function resetOne(){
  if(!curGid){ toast('请先选择要重置的组（在分组页）'); return; }
  if(!confirm(`确认重置第 ${curGid} 组？将清空该组所有练习记录。`)) return;
  const u = loadUser(curUser);
  u.groups[curGid] = { attempts:0, lastReset:Date.now(), lastSaved:null, questions:{} };
  saveUser(u);
  toast('已重置第 '+curGid+' 组');
  renderGroups();
}
function resetAll(){
  if(!confirm('确认清空当前用户全部练习数据？')) return;
  const u = loadUser(curUser);
  for(const k in u.groups) delete u.groups[k];
  saveUser(u);
  toast('已重置全部数据');
  renderGroups();
}

/* ================= 事件绑定 ================= */
document.getElementById('btnLogin').onclick = doLogin;
document.getElementById('loginName').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('btnSwitch').onclick = ()=>{
  if(!confirm('切换用户将保留当前数据，仅进入新用户？')) return;
  curUser = null;
  location.hash = '';
  render();
  document.getElementById('loginName').focus();
};
window.addEventListener('hashchange', ()=>{ /* 预留 */ });
render();
</script>
